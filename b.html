<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Happy Walkies - Hóa đơn</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#7BCAF8">
<style>
  :root { --primary:#7BCAF8; --brand:#233F5B; --bg:#EEF7FC; --card:#fff; --muted:#566878; --line:#C3E3F5; --soft:#C3E3F5; --ok:#1e7a3b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--brand); }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .sheet { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .head { background:var(--primary); padding:18px 18px 16px; display:flex; justify-content:space-between; align-items:flex-end; gap:10px; }
  .brand { font-family:Fredoka,Montserrat,sans-serif; font-weight:600; font-size:24px; line-height:1.1; white-space:nowrap; }
  .tag { font-size:12px; font-weight:500; }
  .head .doc { flex:none; text-align:right; font-size:13px; }
  .head .doc b { display:block; font-size:17px; white-space:nowrap; }
  .head .doc span { white-space:nowrap; }
  .body { padding:16px 18px 18px; }
  .to { display:flex; justify-content:space-between; gap:10px; margin-bottom:12px; font-size:14px; }
  .to .who { font-weight:700; font-size:18px; }
  .muted { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:12px; color:var(--muted); font-weight:600; border-bottom:2px solid var(--line); padding:6px 4px; }
  td { padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  .r { text-align:right; white-space:nowrap; }
  .sum { margin-top:10px; font-size:14px; }
  .sum div { display:flex; justify-content:space-between; padding:3px 4px; }
  .sum .total { font-size:20px; font-weight:700; border-top:2px solid var(--brand); margin-top:6px; padding-top:8px; }
  .note { margin-top:12px; background:var(--bg); border-radius:10px; padding:10px 12px; font-size:14px; white-space:pre-wrap; }
  .pay { margin-top:16px; text-align:center; border:2px dashed var(--line); border-radius:14px; padding:14px; }
  .pay img { width:100%; max-width:300px; display:block; margin:8px auto; }
  .pay .bank { font-size:14px; line-height:1.7; }
  .pay .code { display:inline-block; background:var(--soft); border-radius:8px; padding:2px 10px; font-weight:700; letter-spacing:.03em; }
  .paid { margin-top:16px; text-align:center; color:var(--ok); border:2px solid var(--ok); border-radius:14px; padding:12px; font-weight:700; font-size:18px; }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:14px; }
  .btns { display:flex; gap:8px; margin-top:14px; }
  .btn { flex:1; padding:12px; font:inherit; font-weight:700; border:0; border-radius:10px; background:var(--primary); color:var(--brand); text-align:center; text-decoration:none; cursor:pointer; }
  .btn.alt { background:#fff; border:1px solid var(--brand); }
  .state { text-align:center; color:var(--muted); padding:40px 16px; }
  .hidden { display:none !important; }
  @media print {
    body { background:#fff; }
    main { padding:0; max-width:none; }
    .sheet { border:0; border-radius:0; }
    .btns { display:none; }
    .head, .pay .code, .note { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>
<main>
  <div id="state" class="state">Đang tải hóa đơn...</div>
  <div id="sheet" class="sheet hidden">
    <div class="head">
      <div><div class="brand">Happy Walkies</div><div class="tag">We walk, they wag.</div></div>
      <div class="doc">Hóa đơn<b id="billId"></b><span id="created"></span></div>
    </div>
    <div class="body">
      <div class="to">
        <div><div class="muted">Khách hàng</div><div class="who" id="who"></div></div>
        <div style="text-align:right"><div class="muted">Kỳ</div><b id="month"></b></div>
      </div>
      <table>
        <thead><tr><th>Ngày giờ</th><th>Bé</th><th>Gói</th><th class="r">Thành tiền</th></tr></thead>
        <tbody id="lines"></tbody>
      </table>
      <div class="sum" id="sum"></div>
      <div class="note hidden" id="note"></div>
      <div id="payBox"></div>
      <div class="foot">Cảm ơn anh/chị đã tin tưởng Happy Walkies 🐾</div>
    </div>
  </div>
  <div class="btns hidden" id="btns">
    <button class="btn" id="printBtn">Lưu PDF / In</button>
    <a class="btn alt" id="reportLink">Xem báo cáo các buổi dắt</a>
  </div>
</main>
<script>
  var API = 'https://script.google.com/macros/s/AKfycbxLQ_VTlsAbc3rsxsHRvL3SA1-NhaiWJRDyd2CKDNWRLjA8aO1aCgl8NzIYpO8YAiwxKA/exec';
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function vnd(n) { return (Number(n) < 0 ? '-' : '') + Math.abs(Math.round(Number(n) || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' đ'; }
  function fail(t) { $('state').textContent = t; }

  var q = new URLSearchParams(location.search);
  if (!q.get('c') || !q.get('b')) fail('Link hóa đơn chưa đầy đủ. Vui lòng mở lại link Happy Walkies đã gửi.');
  else fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: 'billDetail', args: [q.get('c'), q.get('b')] }) })
    .then(function (r) { return r.json(); }, function () { throw new Error('Không kết nối được, vui lòng thử lại sau.'); })
    .then(function (res) { if (!res.ok) throw new Error(res.error); render(res.data); })
    .catch(function (e) { fail(e.message); });

  function render(b) {
    document.title = 'Happy Walkies - Hóa đơn ' + b.id;
    $('billId').textContent = b.id;
    $('created').textContent = b.created ? 'Ngày ' + b.created : '';
    $('who').textContent = b.title;
    $('month').textContent = 'Tháng ' + b.month.slice(5, 7) + '/' + b.month.slice(0, 4);
    var tb = $('lines');
    b.lines.forEach(function (l) {
      var tr = el('tr');
      [l.d, l.dog, l.type + "'", vnd(l.price)].forEach(function (v, i) { tr.appendChild(el('td', i === 3 ? 'r' : '', v)); });
      tb.appendChild(tr);
    });
    var sum = $('sum');
    function row(label, value, cls) { var d = el('div', cls); d.appendChild(el('span', null, label)); d.appendChild(el('span', null, value)); sum.appendChild(d); }
    row(b.count + ' buổi dắt', vnd(b.sub));
    if (b.adj) row(b.adj < 0 ? 'Giảm giá' : 'Phụ thu', vnd(b.adj));
    row('Tổng cộng', vnd(b.total), 'total');
    if (b.note) { $('note').textContent = b.note; $('note').classList.remove('hidden'); }

    var pay = $('payBox');
    if (b.paid) {
      pay.appendChild(el('div', 'paid', '✓ Đã thanh toán' + (b.paidOn ? ' ngày ' + b.paidOn : '')));
    } else if (b.bank && b.bank.account) {
      var box = el('div', 'pay');
      box.appendChild(el('b', null, 'Quét mã để chuyển khoản'));
      if (b.qr) { var img = el('img'); img.alt = 'Mã QR chuyển khoản'; img.src = b.qr; img.onerror = function () { img.remove(); }; box.appendChild(img); }
      var info = el('div', 'bank');
      info.appendChild(el('div', null, 'Ngân hàng: ' + b.bank.bank));
      info.appendChild(el('div', null, 'Số tài khoản: ' + b.bank.account));
      if (b.bank.name) info.appendChild(el('div', null, 'Chủ tài khoản: ' + b.bank.name));
      info.appendChild(el('div', null, 'Số tiền: ' + vnd(b.total)));
      var c = el('div', null, 'Nội dung: '); c.appendChild(el('span', 'code', b.id)); info.appendChild(c);
      box.appendChild(info);
      pay.appendChild(box);
    }
    $('reportLink').href = b.report;
    $('state').classList.add('hidden'); $('sheet').classList.remove('hidden'); $('btns').classList.remove('hidden');
  }
  $('printBtn').onclick = function () { window.print(); };
</script>
</body>
</html>
