<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Happy Walkies - Hàng chờ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Happy Walkies">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#7BCAF8">
<style>
  :root { --primary:#7BCAF8; --brand:#233F5B; --bg:#EEF7FC; --card:#fff; --text:#233F5B; --muted:#566878; --line:#C3E3F5; --soft:#C3E3F5; --err:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--primary); color:var(--brand); padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  header h1 { margin:0; }
  .hwName { display:block; font-family:Fredoka,Montserrat,sans-serif; font-weight:600; font-size:24px; line-height:1.15; color:var(--brand); }
  .hwSub { display:block; font-size:13px; font-weight:500; margin-top:2px; }
  header button { background:none; border:1px solid var(--brand); color:var(--brand); padding:4px 10px; border-radius:6px; font-size:13px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-weight:600; margin:0 0 6px; }
  input { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  h2 { font-size:15px; margin:20px 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  h2:first-child { margin-top:0; }
  .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .dog { font-weight:700; font-size:17px; }
  .meta { color:var(--muted); font-size:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { background:var(--soft); color:var(--brand); border-radius:999px; padding:2px 10px; font-size:13px; font-weight:600; }
  .chip.short { background:#f4cccc; color:var(--err); }
  .note { margin:8px 0 0; white-space:pre-wrap; word-break:break-word; font-size:15px; }
  .photosLink { display:inline-block; margin-top:8px; font-size:14px; color:var(--brand); }
  .warn { margin-top:8px; font-size:13px; color:#9a6700; }
  .actions { display:flex; gap:8px; margin-top:12px; }
  .btn { flex:1; padding:12px; font:inherit; font-weight:700; border:0; border-radius:10px; background:var(--primary); color:var(--brand); }
  .btn.alt { flex:0 0 auto; background:#fff; color:var(--brand); border:1px solid var(--brand); }
  .btn:disabled { opacity:.55; }
  .full { width:100%; margin-top:12px; }
  .empty { color:var(--muted); text-align:center; padding:18px 8px; }
  .msg { padding:10px 12px; border-radius:8px; margin-top:12px; display:none; }
  .msg.err { display:block; background:#fdecea; color:var(--err); }
  #toast { position:fixed; left:16px; right:16px; bottom:20px; max-width:520px; margin:0 auto; padding:12px 14px; border-radius:10px; background:var(--brand); color:#fff; font-size:15px; display:none; z-index:5; }
  #toast.on { display:block; }
  #toast.err { background:var(--err); }
  .tabs { display:flex; gap:6px; margin-bottom:14px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:4px; }
  .tabs button { flex:1; padding:10px; font:inherit; font-weight:700; border:0; border-radius:9px; background:none; color:var(--muted); }
  .tabs button.on { background:var(--primary); color:var(--brand); }
  .week { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .week button { flex:none; width:40px; height:40px; font:inherit; font-size:20px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--brand); }
  .week b { flex:1; text-align:center; }
  .days { display:flex; gap:4px; margin-bottom:12px; }
  .days button { flex:1; min-width:0; padding:6px 0; font:inherit; font-size:12px; line-height:1.3; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--brand); }
  .days button b { display:block; font-size:15px; }
  .days button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .days button.today { border-color:var(--primary); border-width:2px; }
  .days button i { display:block; font-style:normal; font-size:11px; opacity:.75; }
  .slot { display:flex; gap:12px; align-items:center; cursor:pointer; }
  .slot .time { font-weight:700; font-size:17px; min-width:52px; }
  .slot .who { flex:1; min-width:0; }
  .st { font-size:12px; font-weight:700; border-radius:999px; padding:2px 8px; white-space:nowrap; }
  .st.todo { background:#f0f3f6; color:var(--muted); }
  .st.on { background:var(--soft); color:var(--brand); }
  .st.done { background:#dff3e4; color:#1e7a3b; }
  .st.late, .st.missed { background:#fdecea; color:var(--err); }
  .form label { margin-top:12px; }
  .form label:first-child { margin-top:0; }
  .form select, .form textarea { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .form textarea { min-height:60px; resize:vertical; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button { flex:1; min-width:40px; padding:10px 6px; font:inherit; font-weight:700; border:2px solid var(--line); border-radius:10px; background:#fff; color:var(--brand); }
  .seg button.on { border-color:var(--brand); background:var(--soft); }
  #fDays { flex-wrap:nowrap; gap:4px; }
  #fDays button { min-width:0; padding:10px 0; font-size:14px; }
  .row2 { display:flex; gap:10px; }
  .row2 > div { flex:1; min-width:0; }
  .btn.danger { flex:0 0 auto; background:#fff; color:var(--err); border:1px solid var(--err); }
  .ruleLine { font-size:14px; padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .ruleLine:last-child { border-bottom:0; }
  .totals { display:flex; gap:8px; margin-bottom:12px; }
  .totals div { flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px; text-align:center; font-size:12px; color:var(--muted); }
  .totals b { display:block; font-size:16px; color:var(--brand); }
  .money { font-weight:700; font-size:17px; }
  .st.paid { background:#dff3e4; color:#1e7a3b; }
  .st.unpaid { background:#fff4d6; color:#8a5a00; }
  .st.none { background:#f0f3f6; color:var(--muted); }
  .actions.wrap { flex-wrap:wrap; }
  .actions.wrap .btn { flex:1 1 40%; padding:10px; font-size:14px; }
  .adjRow { display:flex; gap:8px; margin-top:10px; }
  .adjRow input { font-size:14px; padding:8px 10px; }
  .adjRow input.amt { flex:0 0 120px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1><span class="hwName">Happy Walkies</span><span class="hwSub">Hàng chờ</span></h1>
  <div>
    <button id="reloadBtn" class="hidden">Tải lại</button>
    <button id="logoutBtn" class="hidden">Thoát</button>
  </div>
</header>
<main>
  <section id="pinView" class="card hidden">
    <label for="pin">PIN quản lý</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <button class="btn full" id="pinBtn">Vào</button>
    <div id="pinMsg" class="msg"></div>
  </section>

  <section id="listView" class="hidden">
    <div class="tabs">
      <button id="tabQueue" class="on">Hàng chờ</button>
      <button id="tabSched">Lịch dắt</button>
      <button id="tabBill">Bill</button>
    </div>
    <div id="billView" class="hidden">
      <div class="week">
        <button id="prevMonth" aria-label="Tháng trước">‹</button>
        <b id="monthLabel"></b>
        <button id="nextMonth" aria-label="Tháng sau">›</button>
      </div>
      <div id="billWarn" class="card warn hidden"></div>
      <div id="billTotals" class="totals"></div>
      <div id="billList"></div>
      <p class="meta">Bill tính theo các walk đã <b>Duyệt</b> trong tháng × giá gói (giá chung ở tab Cài đặt, giá riêng từng bé ở tab Dogs).</p>
    </div>
    <div id="queueView">
      <h2 id="pendingTitle">Chờ duyệt</h2>
      <div id="pending"></div>
      <h2>Đã duyệt hôm nay</h2>
      <div id="today"></div>
    </div>
    <div id="schedView" class="hidden">
      <div class="week">
        <button id="prevWeek" aria-label="Tuần trước">‹</button>
        <b id="weekLabel"></b>
        <button id="nextWeek" aria-label="Tuần sau">›</button>
      </div>
      <div id="days" class="days"></div>
      <div id="dayItems"></div>
      <button class="btn full" id="addBtn">+ Thêm walk</button>

      <div id="formCard" class="card form hidden" style="margin-top:12px">
        <b id="formTitle">Thêm walk</b>
        <label for="fDog" style="margin-top:12px">Bé</label>
        <select id="fDog"></select>
        <div class="row2">
          <div><label for="fTime">Giờ</label><input id="fTime" type="time"></div>
          <div><label>Gói</label><div id="fType" class="seg"></div></div>
        </div>
        <label for="fStaff">Nhân viên</label>
        <select id="fStaff"></select>
        <label>Lặp lại</label>
        <div id="fKind" class="seg">
          <button data-k="once">Một ngày</button>
          <button data-k="weekly">Hằng tuần</button>
        </div>
        <div id="onceBox"><label for="fDate">Ngày</label><input id="fDate" type="date"></div>
        <div id="weeklyBox">
          <label>Các thứ</label>
          <div id="fDays" class="seg"></div>
          <label for="fPause">Tạm nghỉ đến hết ngày <span class="meta">(khách đi vắng, để trống nếu không)</span></label>
          <input id="fPause" type="date">
        </div>
        <label for="fNote">Ghi chú cho nhân viên</label>
        <textarea id="fNote" maxlength="300"></textarea>
        <div class="actions">
          <button class="btn" id="saveBtn">Lưu</button>
          <button class="btn danger hidden" id="delBtn">Xóa</button>
          <button class="btn alt" id="cancelBtn">Hủy</button>
        </div>
      </div>

      <h2 style="margin-top:22px">Tất cả lịch</h2>
      <div id="rules" class="card"></div>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
  var API = 'https://script.google.com/macros/s/AKfycbxLQ_VTlsAbc3rsxsHRvL3SA1-NhaiWJRDyd2CKDNWRLjA8aO1aCgl8NzIYpO8YAiwxKA/exec';
  var mpin = null, data = { pending: [], today: [] };

  function $(id) { return document.getElementById(id); }
  function show(id, on) { $(id).classList.toggle('hidden', !on); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function call(fn) {
    var args = [].slice.call(arguments, 1);
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args })
    }).then(function (r) { return r.json(); }, function () {
      throw new Error('Mất kết nối mạng, vui lòng thử lại.');
    }).then(function (res) {
      if (!res.ok) throw new Error(res.error);
      return res.data;
    });
  }
  function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  var toastTimer;
  function toast(text, isErr) {
    var t = $('toast'); t.textContent = text; t.className = 'on' + (isErr ? ' err' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = ''; }, isErr ? 6000 : 3500);
  }
  function num(n) { return String(Math.round(Number(n) * 100) / 100).replace('.', ','); }

  // Copy phải chạy ngay trong lúc bấm (Safari không cho copy sau khi chờ mạng)
  function copyText(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    if (!ok && navigator.clipboard) { navigator.clipboard.writeText(text).catch(function () {}); ok = true; }
    return ok;
  }
  function openZalo(url) { if (url) window.open(url, '_blank', 'noopener'); }

  // ---- Đăng nhập ----
  function login(saved) {
    var pin = saved || $('pin').value.trim();
    if (!pin) return;
    $('pinBtn').disabled = true; $('pinMsg').className = 'msg';
    call('managerQueue', pin).then(function (res) {
      mpin = pin; store('hw_mpin', pin); data = res;
      show('pinView', false); show('listView', true); show('reloadBtn', true); show('logoutBtn', true);
      render();
    }).catch(function (e) {
      store('hw_mpin', null);
      show('pinView', true);
      if (!saved) { $('pinMsg').textContent = e.message; $('pinMsg').className = 'msg err'; }
    }).then(function () { $('pinBtn').disabled = false; });
  }
  $('pinBtn').onclick = function () { login(); };
  $('pin').onkeydown = function (e) { if (e.key === 'Enter') login(); };
  $('logoutBtn').onclick = function () {
    store('hw_mpin', null); mpin = null; $('pin').value = ''; sched = null; bills = null;
    show('listView', false); show('reloadBtn', false); show('logoutBtn', false); show('pinView', true);
  };
  $('reloadBtn').onclick = function () { tab === 'sched' ? loadSched(true) : tab === 'bill' ? loadBills(true) : refresh(); };
  function refresh() {
    $('reloadBtn').disabled = true;
    call('managerQueue', mpin).then(function (res) { data = res; render(); toast('Đã cập nhật'); })
      .catch(function (e) { toast(e.message, true); })
      .then(function () { $('reloadBtn').disabled = false; });
  }

  // ---- Danh sách ----
  function render() {
    $('pendingTitle').textContent = 'Chờ duyệt (' + data.pending.length + ')';
    fill('pending', data.pending, true, 'Không có walk nào chờ duyệt 🎉');
    fill('today', data.today, false, 'Chưa có walk nào được duyệt hôm nay.');
  }
  function fill(id, list, pending, emptyText) {
    var box = $(id); box.innerHTML = '';
    if (!list.length) return box.appendChild(el('div', 'card empty', emptyText));
    list.forEach(function (w) { box.appendChild(card(w, pending)); });
  }
  function card(w, pending) {
    var c = el('div', 'card');
    var top = el('div', 'top');
    top.appendChild(el('span', 'dog', w.dog));
    top.appendChild(el('span', 'meta', w.whenText + ' · ' + w.staff));
    c.appendChild(top);
    var chips = el('div', 'chips');
    if (w.type) chips.appendChild(el('span', 'chip', "Gói " + w.type + "'"));
    chips.appendChild(el('span', 'chip' + (w.type && Number(w.minutes) < Number(w.type) ? ' short' : ''), w.minutes + ' phút'));
    chips.appendChild(el('span', 'chip', num(w.km) + ' km'));
    c.appendChild(chips);
    if (w.note) c.appendChild(el('p', 'note', w.note));
    if (w.folderUrl) {
      var a = el('a', 'photosLink', 'Xem ảnh / video ↗'); a.href = w.folderUrl; a.target = '_blank'; a.rel = 'noopener';
      c.appendChild(a);
    }
    if (!w.hasLink) c.appendChild(el('div', 'warn', 'Bé chưa có link báo cáo (tab Dogs) – tin nhắn sẽ thiếu link.'));
    else if (!w.zalo) c.appendChild(el('div', 'warn', 'Chưa có "Link group Zalo" ở tab Dogs – chỉ copy tin, tự mở group.'));

    var actions = el('div', 'actions');
    if (pending) {
      var send = el('button', 'btn', w.zalo ? 'Duyệt & gửi khách' : 'Duyệt & copy tin');
      var only = el('button', 'btn alt', 'Chỉ duyệt');
      send.onclick = function () {
        var copied = copyText(w.message);
        openZalo(w.zalo);
        approve(w, [send, only], copied ? 'Đã duyệt · tin đã copy, dán vào group Zalo' : 'Đã duyệt (không copy được, bấm "Copy tin")');
      };
      only.onclick = function () { approve(w, [send, only], 'Đã duyệt, khách xem được trên link báo cáo'); };
      actions.appendChild(send); actions.appendChild(only);
    } else {
      var copy = el('button', 'btn', w.zalo ? 'Copy tin & mở group' : 'Copy tin');
      copy.onclick = function () {
        var ok = copyText(w.message);
        openZalo(w.zalo);
        toast(ok ? 'Đã copy tin nhắn' : 'Không copy được', !ok);
      };
      actions.appendChild(copy);
    }
    c.appendChild(actions);
    return c;
  }
  function approve(w, buttons, okText) {
    buttons.forEach(function (b) { b.disabled = true; });
    call('approveWalk', mpin, w.row, w.dog, w.when).then(function () {
      data.pending = data.pending.filter(function (x) { return x !== w; });
      var today = new Date(), iso = today.getFullYear() + '-' + ('0' + (today.getMonth() + 1)).slice(-2) + '-' + ('0' + today.getDate()).slice(-2);
      if (w.when.slice(0, 10) === iso) data.today.unshift(w);
      render(); toast(okText);
    }).catch(function (e) {
      buttons.forEach(function (b) { b.disabled = false; });
      toast('Chưa duyệt được: ' + e.message, true);
    });
  }

  // ---- Lịch dắt ----
  var WD = ['', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
  var STATE_TEXT = { todo: 'Chưa tới giờ', late: 'Trễ, chưa check in', missed: 'Không check in', on: 'Đang dắt', done: 'Xong' };
  var tab = 'queue', sched = null, weekStart = null, selDay = null, editing = null, form = {};
  function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function monday(d) { d = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function ddmm(s) { return s ? s.slice(8, 10) + '/' + s.slice(5, 7) : ''; }

  function setTab(t) {
    tab = t;
    $('tabQueue').classList.toggle('on', t === 'queue'); $('tabSched').classList.toggle('on', t === 'sched');
    $('tabBill').classList.toggle('on', t === 'bill');
    show('queueView', t === 'queue'); show('schedView', t === 'sched'); show('billView', t === 'bill');
    document.querySelector('.hwSub').textContent = t === 'queue' ? 'Hàng chờ' : t === 'sched' ? 'Lịch dắt' : 'Bill';
    if (t === 'sched' && !sched) loadSched();
    if (t === 'bill' && !bills) loadBills();
  }
  $('tabBill').onclick = function () { setTab('bill'); };
  $('tabQueue').onclick = function () { setTab('queue'); };
  $('tabSched').onclick = function () { setTab('sched'); };
  $('prevWeek').onclick = function () { weekStart = addDays(weekStart, -7); selDay = iso(weekStart); loadSched(); };
  $('nextWeek').onclick = function () { weekStart = addDays(weekStart, 7); selDay = iso(weekStart); loadSched(); };

  function loadSched(withToast) {
    if (!weekStart) { weekStart = monday(new Date()); selDay = iso(new Date()); }
    $('weekLabel').textContent = ddmm(iso(weekStart)) + ' – ' + ddmm(iso(addDays(weekStart, 6)));
    $('dayItems').innerHTML = '<div class="card empty">Đang tải...</div>';
    $('reloadBtn').disabled = true;
    return call('managerSchedule', mpin, iso(weekStart)).then(function (res) {
      sched = res; renderSched();
      if (withToast) toast('Đã cập nhật');
    }).catch(function (e) {
      $('dayItems').innerHTML = ''; toast(e.message, true);
    }).then(function () { $('reloadBtn').disabled = false; });
  }
  function renderSched() {
    var box = $('days'); box.innerHTML = '';
    sched.days.forEach(function (d) {
      var b = el('button', (d.date === selDay ? 'on' : '') + (d.date === sched.today ? ' today' : ''));
      var parts = d.label.split(' ');
      b.appendChild(document.createTextNode(parts[0]));
      b.appendChild(el('b', null, parts[1].slice(0, 2)));
      b.appendChild(el('i', null, d.items.length ? d.items.length + ' walk' : '–'));
      b.onclick = function () { selDay = d.date; renderSched(); };
      box.appendChild(b);
    });
    var day = sched.days.filter(function (d) { return d.date === selDay; })[0] || sched.days[0];
    selDay = day.date;
    var list = $('dayItems'); list.innerHTML = '';
    if (!day.items.length) list.appendChild(el('div', 'card empty', 'Chưa có walk nào ngày ' + day.label + '.'));
    day.items.forEach(function (it) {
      var c = el('div', 'card slot');
      c.appendChild(el('span', 'time', it.hhmm));
      var who = el('div', 'who');
      who.appendChild(el('div', 'dog', it.dog));
      who.appendChild(el('div', 'meta', (it.staff || 'Chưa giao ai') + ' · ' + it.type + "'" + (it.note ? ' · ' + it.note : '')));
      c.appendChild(who);
      var text = STATE_TEXT[it.state] || '';
      if (it.state === 'on') text = 'Đang dắt từ ' + it.checkIn;
      if (it.state === 'done') text = it.checkIn + '–' + it.checkOut + (it.late >= 15 ? ' · trễ ' + it.late + "'" : '');
      c.appendChild(el('span', 'st ' + it.state, text));
      c.onclick = function () { var r = ruleByRow(it.row); if (r) openForm(r); };
      list.appendChild(c);
    });
    var rules = $('rules'); rules.innerHTML = '';
    if (!sched.rules.length) rules.appendChild(el('div', 'empty', 'Chưa có lịch nào. Bấm "+ Thêm walk".'));
    sched.rules.forEach(function (r) {
      var when = r.once ? 'Ngày ' + ddmm(r.once) : r.days.length === 7 ? 'Hằng ngày' : r.days.map(function (w) { return WD[w]; }).join(' ') || r.dayText;
      var line = el('div', 'ruleLine');
      line.appendChild(el('b', null, r.time + ' · ' + r.dog));
      line.appendChild(document.createTextNode(' — ' + when + ' · ' + (r.staff || 'chưa giao') + ' · ' + r.type + "'" +
        (r.pause && r.pause >= sched.today ? ' · nghỉ đến ' + ddmm(r.pause) : '')));
      line.onclick = function () { openForm(r); };
      rules.appendChild(line);
    });
  }
  function ruleByRow(row) { return sched.rules.filter(function (r) { return r.row === row; })[0]; }

  function fillSelect(id, items, first, value) {
    var s = $(id); s.innerHTML = '';
    if (first) { var o0 = el('option', null, first); o0.value = ''; s.appendChild(o0); }
    items.forEach(function (x) { var o = el('option', null, x); o.value = x; s.appendChild(o); });
    if (value && items.indexOf(value) < 0) { var ox = el('option', null, value); ox.value = value; s.appendChild(ox); }
    s.value = value || '';
  }
  function segButtons(id, items, label, isOn, onClick) {
    var box = $(id); box.innerHTML = '';
    items.forEach(function (x) {
      var b = el('button', isOn(x) ? 'on' : '', label(x));
      b.type = 'button'; b.onclick = function () { onClick(x); };
      box.appendChild(b);
    });
  }
  function renderForm() {
    segButtons('fType', sched.types, function (t) { return t + "'"; }, function (t) { return form.type === t; },
      function (t) { form.type = t; renderForm(); });
    segButtons('fDays', [1, 2, 3, 4, 5, 6, 7], function (w) { return WD[w]; }, function (w) { return form.days.indexOf(w) >= 0; },
      function (w) { var i = form.days.indexOf(w); i >= 0 ? form.days.splice(i, 1) : form.days.push(w); renderForm(); });
    [].forEach.call($('fKind').children, function (b) {
      b.type = 'button'; b.classList.toggle('on', b.getAttribute('data-k') === form.kind);
      b.onclick = function () { form.kind = b.getAttribute('data-k'); renderForm(); };
    });
    show('onceBox', form.kind === 'once'); show('weeklyBox', form.kind === 'weekly');
  }
  function openForm(r) {
    editing = r || null;
    form = r ? { type: r.type, kind: r.once ? 'once' : 'weekly', days: r.days.slice() }
      : { type: sched.types[0], kind: 'weekly', days: [] };
    $('formTitle').textContent = r ? 'Sửa lịch ' + r.dog + ' ' + r.time : 'Thêm walk';
    fillSelect('fDog', sched.dogs, '— Chọn bé —', r ? r.dog : '');
    fillSelect('fStaff', sched.staff, 'Ai cũng được', r ? r.staff : '');
    $('fTime').value = r ? r.time : '';
    $('fDate').value = r && r.once ? r.once : selDay;
    $('fPause').value = r ? r.pause : '';
    $('fNote').value = r ? r.note : '';
    show('delBtn', !!r);
    renderForm(); show('formCard', true); show('addBtn', false);
    $('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function closeForm() { show('formCard', false); show('addBtn', true); editing = null; }
  $('addBtn').onclick = function () { openForm(null); };
  $('cancelBtn').onclick = closeForm;
  $('saveBtn').onclick = function () {
    var d = { dog: $('fDog').value, staff: $('fStaff').value, time: $('fTime').value, type: form.type, note: $('fNote').value.trim() };
    if (form.kind === 'once') d.once = $('fDate').value; else { d.days = form.days; d.pause = $('fPause').value; }
    var err = !d.dog ? 'Chọn bé.' : !d.time ? 'Nhập giờ.' : form.kind === 'once' && !d.once ? 'Chọn ngày.' :
      form.kind === 'weekly' && !d.days.length ? 'Chọn ít nhất 1 thứ.' : '';
    if (err) return toast(err, true);
    var btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Đang lưu...';
    call('saveSchedule', mpin, editing ? editing.row : 0, editing ? editing.sig : '', d).then(function () {
      closeForm(); toast('Đã lưu lịch'); return loadSched();
    }).catch(function (e) { toast(e.message, true); })
      .then(function () { btn.disabled = false; btn.textContent = 'Lưu'; });
  };
  $('delBtn').onclick = function () {
    if (!editing || !confirm('Xóa lịch ' + editing.dog + ' ' + editing.time + '? (Các lần check in cũ vẫn giữ)')) return;
    var btn = $('delBtn'); btn.disabled = true;
    call('deleteSchedule', mpin, editing.row, editing.sig).then(function () {
      closeForm(); toast('Đã xóa lịch'); return loadSched();
    }).catch(function (e) { toast(e.message, true); })
      .then(function () { btn.disabled = false; });
  };

  // ---- Bill cuối tháng ----
  var SITE = 'https://happywalkies.github.io/';
  var bills = null, billMonth = null;
  function vnd(n) { return Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' đ'; }
  function monthText(m) { return m.slice(5, 7) + '/' + m.slice(0, 4); }
  function shiftMonth(m, n) {
    var d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + n, 1);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  }
  function billLink(token, id) { return SITE + 'b.html?c=' + encodeURIComponent(token) + '&b=' + encodeURIComponent(id); }
  $('prevMonth').onclick = function () { billMonth = shiftMonth(billMonth, -1); loadBills(); };
  $('nextMonth').onclick = function () { billMonth = shiftMonth(billMonth, 1); loadBills(); };

  function loadBills(withToast) {
    if (!billMonth) { // đầu tháng (ngày 1–7) thường làm bill tháng trước
      var now = new Date(), cur = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
      billMonth = now.getDate() <= 7 ? shiftMonth(cur, -1) : cur;
    }
    $('monthLabel').textContent = 'Tháng ' + monthText(billMonth);
    $('billList').innerHTML = '<div class="card empty">Đang tải...</div>';
    $('reloadBtn').disabled = true;
    return call('managerBills', mpin, billMonth).then(function (res) {
      bills = res; renderBills();
      if (withToast) toast('Đã cập nhật');
    }).catch(function (e) { $('billList').innerHTML = ''; toast(e.message, true); })
      .then(function () { $('reloadBtn').disabled = false; });
  }
  function renderBills() {
    var warn = $('billWarn');
    warn.textContent = bills.missing.length ? 'Chưa có ' + bills.missing.join(', ') + ' → điền ở tab "Cài đặt" trong Sheet rồi bấm Tải lại.' : '';
    show('billWarn', bills.missing.length > 0);
    var total = 0, billed = 0, paid = 0;
    bills.clients.forEach(function (c) {
      total += c.amount;
      if (c.bill) { billed += c.bill.total; if (c.bill.paid) paid += c.bill.total; }
    });
    var t = $('billTotals'); t.innerHTML = '';
    [['Theo walk', vnd(total)], ['Đã tạo bill', vnd(billed)], ['Đã thu', vnd(paid)]].forEach(function (x) {
      var d = el('div'); d.appendChild(el('b', null, x[1])); d.appendChild(document.createTextNode(x[0])); t.appendChild(d);
    });
    var list = $('billList'); list.innerHTML = '';
    if (!bills.clients.length) list.appendChild(el('div', 'card empty', 'Tháng ' + monthText(bills.month) + ' chưa có walk nào được duyệt.'));
    bills.clients.forEach(function (c) { list.appendChild(billCard(c)); });
  }
  function billCard(c) {
    var card = el('div', 'card'), b = c.bill;
    var top = el('div', 'top');
    top.appendChild(el('span', 'dog', c.title));
    top.appendChild(el('span', 'st ' + (!b ? 'none' : b.paid ? 'paid' : 'unpaid'),
      !b ? 'Chưa tạo bill' : b.paid ? 'Đã trả ' + b.paidOn.slice(0, 5) : 'Chưa trả'));
    card.appendChild(top);
    var parts = Object.keys(c.byType).map(function (k) { return c.byType[k] + "×" + k + "'"; });
    card.appendChild(el('div', 'meta', c.count + ' walk' + (parts.length ? ' (' + parts.join(', ') + ')' : '')));
    card.appendChild(el('div', 'money', b ? vnd(b.total) + (b.adj ? ' (điều chỉnh ' + (b.adj > 0 ? '+' : '') + vnd(b.adj) + ')' : '') : vnd(c.amount)));
    if (b) card.appendChild(el('div', 'meta', 'Mã bill ' + b.id + ' · tạo ' + b.created));
    if (c.missing.length) card.appendChild(el('div', 'warn', "Chưa có giá gói " + c.missing.join("', ") + "'."));
    if (c.outdated) card.appendChild(el('div', 'warn', 'Số walk đã thay đổi từ lúc tạo bill (' + c.count + ' walk, ' + vnd(c.amount) + '). Bấm "Tạo lại" để cập nhật.'));

    var actions = el('div', 'actions wrap');
    function btn(text, cls, fn) { var x = el('button', 'btn' + (cls ? ' ' + cls : ''), text); x.onclick = function () { fn(x); }; actions.appendChild(x); return x; }
    var adjRow = null;
    if (!b || !b.paid) {
      adjRow = el('div', 'adjRow hidden');
      var amt = el('input', 'amt'); amt.type = 'number'; amt.inputMode = 'numeric'; amt.placeholder = '± tiền';
      var note = el('input'); note.placeholder = 'Ghi chú trên bill (không bắt buộc)';
      if (b) { amt.value = b.adj || ''; note.value = b.note || ''; }
      adjRow.appendChild(amt); adjRow.appendChild(note);
    }
    function makeBill(x) {
      if (b && !confirm('Tạo lại bill ' + b.id + ' theo số walk hiện tại?')) return;
      x.disabled = true;
      call('createBill', mpin, c.token, bills.month, adjRow ? adjRow.firstChild.value : 0, adjRow ? adjRow.lastChild.value : '')
        .then(function (res) { bills = res; renderBills(); toast('Đã tạo bill'); })
        .catch(function (e) { x.disabled = false; toast(e.message, true); });
    }
    if (!b) {
      btn('Tạo bill', '', makeBill);
      btn('± Điều chỉnh', 'alt', function () { adjRow.classList.toggle('hidden'); });
    } else {
      var link = billLink(c.token, b.id);
      if (!b.paid) {
        btn(c.zalo ? 'Gửi khách (Zalo)' : 'Copy tin gửi khách', '', function () {
          var text = 'Chào anh/chị, Happy Walkies gửi hóa đơn tháng ' + monthText(b.month) + ' của bé ' + c.title + ': ' +
            b.count + ' buổi dắt, tổng ' + vnd(b.total) + '.\nXem chi tiết & mã QR chuyển khoản: ' + link +
            '\nNội dung chuyển khoản: ' + b.id + '. Cảm ơn anh/chị!';
          var ok = copyText(text); openZalo(c.zalo);
          toast(ok ? 'Đã copy tin nhắn, dán vào group Zalo' : 'Không copy được', !ok);
        });
        btn('✓ Đã nhận tiền', 'alt', function (x) { setPaid(b, true, x); });
      }
      btn('Xem bill', 'alt', function () { window.open(link, '_blank', 'noopener'); });
      if (!b.paid) {
        btn('Tạo lại', 'alt', makeBill);
        btn('± Điều chỉnh', 'alt', function () { adjRow.classList.toggle('hidden'); });
        btn('Xóa', 'danger', function (x) {
          if (!confirm('Xóa bill ' + b.id + '?')) return;
          x.disabled = true;
          call('deleteBill', mpin, b.id).then(function (res) { bills = res; renderBills(); toast('Đã xóa bill'); })
            .catch(function (e) { x.disabled = false; toast(e.message, true); });
        });
      } else {
        btn('Bỏ đánh dấu đã trả', 'alt', function (x) { setPaid(b, false, x); });
      }
    }
    card.appendChild(actions);
    if (adjRow) card.appendChild(adjRow);
    return card;
  }
  function setPaid(b, paid, x) {
    if (paid && !confirm('Xác nhận đã nhận ' + vnd(b.total) + ' cho bill ' + b.id + '?')) return;
    x.disabled = true;
    call('setBillPaid', mpin, b.id, paid).then(function (res) { bills = res; renderBills(); toast(paid ? 'Đã đánh dấu đã trả' : 'Đã bỏ đánh dấu'); })
      .catch(function (e) { x.disabled = false; toast(e.message, true); });
  }

  var saved = load('hw_mpin');
  if (saved) login(saved); else show('pinView', true);
</script>
</body>
</html>
